        agenda:
          type: array
          items:
            $ref: '#/components/schemas/AgendaEvent'
        events:
          type: array
          items: {}
        grades:
          type: array
          items:
            $ref: '#/components/schemas/Grade'
        notes:
          $ref: '#/components/schemas/Notes'
        homeworks:
          type: array
          items:
            $ref: '#/components/schemas/Homework'
    TalkTeachers:
