                    deadlineDate:
                      type: string
                      format: date
                      example: '2026-10-21'
                    payExpired: *id003
                    amountPaid: *id004
                    amountBonus: *id004
                    payDate:
                      type: string
                      format: date
                      example: '2026-10-21'
