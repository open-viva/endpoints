              books:
                type: array
                items:
                  type: object
                  properties:
                    bookId: *id002
                    isbnCode: *id001
                    title: *id001
                    subheading: *id001
                    volume: *id001
                    author: *id001
                    publisher: *id001
                    subjectDesc: *id001
                    price: *id004
                    toBuy: *id003
                    newAdoption: *id003
                    alreadyOwned: *id003
                    alreadyInUse: *id003
                    recommended: *id003
                    recommendedFor:
                      type: string
                      nullable: true
                    coverUrl:
                      type: string
                      nullable: true
                    publisherUnlockCode: *id001
