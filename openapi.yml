openapi: 3.0.3
info:
  title: ClasseViva Web API
  version: 1.0.0
  description: 'Unofficial, community-maintained description of the ClasseViva (Spaggiari) REST API used by the web client
    at `web.spaggiari.eu`.


    Not affiliated with, endorsed by, or supported by Spaggiari. Use at your own risk and in compliance with the applicable
    terms of service.


    Dates in paths are `YYYYMMDD`. Endpoints without a response schema are not documented yet. From a CDN or similar you need
    a proxy (e.g. a Cloudflare worker).'
servers:
- url: https://web.spaggiari.eu/rest/w1
  description: REST API
security:
- sessionCookie: []
tags:
- name: Auth
- name: User
- name: Account
- name: Periods
- name: Dashboard
- name: Subjects
- name: Grades
- name: Absences
- name: Agenda
- name: Lessons
- name: Noticeboard
- name: Communications
- name: Didactics
- name: Homeworks
- name: Notes
- name: Documents
- name: Talks
- name: Payments
- name: Schoolbooks
- name: Other
- name: Canteen
- name: Roll call
paths:
  /misc/whoami:
    get:
      tags:
      - User
      operationId: whoami
      summary: Current user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhoAmI'
        '401':
          description: Session no longer valid
  /students/{studentId}/_functions:
    get:
      tags:
      - User
      operationId: getFunctions
      summary: Enabled sections and UI options
      description: Options only control what the web UI shows (e.g. `opt:votiHideAverage` hides averages in the page, `/avg/`
        still returns them).
      parameters:
      - $ref: '#/components/parameters/studentId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Functions'
        '401':
          description: Session no longer valid
  /students/{studentId}/periods:
    get:
      tags:
      - Periods
      operationId: getPeriods
      summary: School periods
      description: '`periodPos` is not sequential (1 and 3 with two periods).'
      parameters:
      - $ref: '#/components/parameters/studentId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Periods'
        '401':
          description: Session no longer valid
  /students/{studentId}/card:
    get:
      tags:
      - User
      operationId: getCard
      summary: Student card
      parameters:
      - $ref: '#/components/parameters/studentId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentCard'
        '401':
          description: Session no longer valid
  /xauth/myportfolio:
    get:
      tags:
      - Account
      operationId: getPortfolio
      summary: Accounts linked to the login
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Portfolio'
        '401':
          description: Session no longer valid
  /xauth/connect:
    post:
      tags:
      - Account
      operationId: connectAccount
      summary: Link another account
      description: Status `waiting-for-validation` means a confirmation mail was sent.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                email: &id001
                  type: string
                password: *id001
                force: &id003
                  type: boolean
              required:
              - email
      responses:
        '200':
          description: Response not documented yet
        '401':
          description: Session no longer valid
  /xauth/disconnect:
    post:
      tags:
      - Account
      operationId: disconnectAccount
      summary: Unlink an account
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Response not documented yet
        '401':
          description: Session no longer valid
  /xauth/changepassword:
    post:
      tags:
      - Account
      operationId: changePassword
      summary: Change password
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                oldPass: *id001
                newPass: *id001
                newPassCpy: *id001
              required:
              - oldPass
              - newPass
              - newPassCpy
      responses:
        '200':
          description: Response not documented yet
        '401':
          description: Session no longer valid
  /students/{studentId}/dashboard:
    get:
      tags:
      - Dashboard
      operationId: getDashboard
      summary: Dashboard in one call
      description: Each key has the same shape as its dedicated endpoint.
      parameters:
      - $ref: '#/components/parameters/studentId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '401':
          description: Session no longer valid
  /students/{studentId}/overview/all26/{dateFrom}/{dateTo}:
    get:
      tags:
      - Dashboard
      operationId: getOverview
      summary: Daily overview
      description: Lessons, agenda, homework and notes for the range (usually one day). `agenda` can contain items after the
        requested day.
      parameters:
      - $ref: '#/components/parameters/studentId'
      - $ref: '#/components/parameters/dateFrom'
      - $ref: '#/components/parameters/dateTo'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Overview'
        '401':
          description: Session no longer valid
  /students/{studentId}/subjects:
    get:
      tags:
      - Subjects
      operationId: getSubjects
