              properties:
                uid:
                  type: string
                  description: Username
                pwd:
                  type: string
                  description: Password (aLoginPwd)
                cid:
                  type: string
                  description: School code, can be empty
                pin:
                  type: string
                  description: PIN if set, else empty
                target:
                  type: string
                  description: Can be empty
              required:
              - uid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: PHPSESSID
      description: Session cookie from login. `webidentity`, `webrole` and `i18n_redirected` are also sent by the browser.
  parameters:
    studentId:
      name: studentId
      in: path
      required: true
      schema: &id002
        type: integer
      description: Numeric `id` from `whoami` (not the `S12345678C` ident)
    id:
      name: id
      in: path
      required: true
      schema: *id002
      description: Student id (same as `studentId`) or resource id, see the path
    dateFrom:
      name: dateFrom
      in: path
      required: true
      schema:
        type: string
        pattern: ^\d{8}$
      example: '20260901'
      description: YYYYMMDD
    dateTo:
      name: dateTo
      in: path
      required: true
      schema:
        type: string
        pattern: ^\d{8}$
      example: '20270630'
      description: YYYYMMDD
    date:
      name: date
      in: path
      required: true
      schema:
        type: string
        pattern: ^\d{8}$
      example: '20261021'
      description: YYYYMMDD
    subjectId:
      name: subjectId
      in: path
      required: true
      schema: *id002
    teacherId:
      name: teacherId
      in: path
      required: true
      schema: *id002
      description: Numeric, without the `A` prefix
    evtCode:
      name: evtCode
      in: path
      required: true
      schema: *id001
    pubId:
      name: pubId
      in: path
      required: true
      schema: *id002
    attachNum:
      name: attachNum
      in: path
      required: true
      schema: *id002
    hash:
      name: hash
      in: path
      required: true
      schema: *id001
    type:
      name: type
      in: path
      required: true
      schema:
        type: string
        enum:
        - NTTE
        - NTCL
        - NTWN
        - NTST
    meal:
      name: meal
      in: path
      required: true
      schema:
        type: string
        default: pranzo
  schemas:
    LoginResponse:
      type: object
      properties:
        time:
          type: string
          format: date-time
          example: '2026-10-21T16:01:14+02:00'
        data:
          type: object
          properties:
            auth:
              type: object
              properties:
                verified: *id003
                loggedIn: *id003
                actionRequested:
                  oneOf:
                  - *id003
                  - *id001
                  description: '`false`, or a string such as `changePasswordDialog` (password expired)'
                hints:
                  type: array
                  items: {}
                errors:
                  type: array
                  items: {}
                accountInfo:
                  type: object
                  properties:
                    type: *id001
                    id: *id002
                    cognome: *id001
                    nome: *id001
                    cid: *id001
                redirects:
                  type: array
                  items: {}
                aMode: *id001
                mMode: *id001
                errCod:
                  type: array
                  items: {}
            pfolio: *id003
        error:
          type: array
          items: {}
        api:
          type: object
          additionalProperties: true
    WhoAmI:
      type: object
      properties:
        id:
          type: string
          example: '12345678'
          description: Numeric student id, as a string
        account_type: *id001
        sede_codice: *id001
        anno_scol:
          type: string
          example: '2026'
          description: Start year of the school year
        cognome: *id001
        nome: *id001
        classe_ident: *id001
        classe_desc: *id001
        data_nascita:
          type: string
          format: date
          example: '2026-10-21'
        codice_fisc: *id001
        login_type:
          type: string
          nullable: true
        last_login_at:
          type: string
          nullable: true
        email: *id001
        schoolpass: *id001
    Functions:
      type: object
      properties:
        functions:
          type: object
          additionalProperties:
            type: object
            properties:
              title: *id001
              desc: *id001
              type: *id001
              url:
                type: string
                nullable: true
              options:
                description: Object keyed `opt:*`, or `[]` when empty
                oneOf:
                - type: object
                  additionalProperties: true
                - type: array
                  maxItems: 0
              readonly: *id003
        appEnabled:
          type: array
          items: *id001
    Periods:
      type: object
      properties:
        periods:
          type: array
          items:
            type: object
            properties:
              periodCode: *id001
              periodPos: *id002
              periodDesc: *id001
              periodLabel: *id001
              isFinal: *id003
              dateStart:
                type: string
                format: date
                example: '2026-10-21'
              dateEnd:
                type: string
                format: date
                example: '2026-10-21'
              miurDivisionCode:
                type: string
                nullable: true
    StudentCard:
      type: object
      properties:
        card:
          type: object
          properties:
            ident: *id001
            usrType: *id001
            usrId: *id002
            miurSchoolCode: *id001
            miurDivisionCode: *id001
            firstName: *id001
            lastName: *id001
            birthDate:
              type: string
              format: date
              example: '2026-10-21'
            fiscalCode: *id001
            schCode: *id001
            schName:
              type: string
              description: Padded with trailing spaces
            schDedication: *id001
            schCity: *id001
            schProv: *id001
    Portfolio:
      type: object
      properties:
        currentIdent: *id001
        portfolio:
          type: object
          properties:
            master:
              type: object
              properties:
                id: *id002
                masterId:
                  type: integer
                  nullable: true
                authType: *id001
                authString: *id001
                authDesc: *id001
                emlFlags: *id002
                passChanged:
                  type: string
                  format: date-time
                  example: '2026-10-21T16:01:14+02:00'
                passRemindExpire:
                  type: string
                  nullable: true
                validationNeeded: *id003
                validationExpire:
                  type: string
                  nullable: true
                insertDT:
                  type: string
                  format: date-time
                  example: '2026-10-21T16:01:14+02:00'
            items:
              type: array
              items:
                type: object
                properties:
                  id: *id002
                  target: *id001
                  cid: *id001
                  ident: *id001
                  userType: *id001
                  userId: *id002
                  description: *id001
                  spsPrivacyFlags: *id002
                  insertDT:
                    type: string
                    format: date-time
                    example: '2026-10-21T16:01:14+02:00'
                  personalInfo:
                    type: object
                    properties:
                      firstName: *id001
                      lastName: *id001
                      birthDate:
                        type: string
                        format: date
                        example: '2026-10-21'
                      fiscalCode: *id001
                      classDesc: *id001
                      schoolYY: *id002
    Grade:
      type: object
      properties:
        subjectId: *id002
        subjectCode:
          type: string
          nullable: true
        subjectDesc: *id001
        evtId: *id002
        evtCode: *id001
        evtDate:
          type: string
          format: date
          example: '2026-10-21'
        decimalValue:
          type: number
          nullable: true
          description: Raw numeric grade. `null` for non-numeric judgments (e.g. `ds`, `o`)
        displayValue:
          type: string
          description: Formatted grade, e.g. `8½` = 8.5; always usable
        displaPos: *id002
        notesForFamily: *id001
        color:
          type: string
          description: 'approx.: green >=6, yellow ~5-6, red <5'
        canceled: *id003
        underlined: *id003
        periodPos: *id002
        periodDesc: *id001
        periodLabel: *id001
        componentPos:
          type: integer
          enum:
          - 1
          - 2
          - 3
          description: 1 Scritto/Grafico, 2 Orale, 3 Pratico
        componentDesc: *id001
        weightFactor:
          type: integer
          description: Percentage (100 = weight 1)
        noAverage: *id003
        teacherName: *id001
        evtPosition:
          type: string
          description: '`S{periodPos}_{componentPos}_{index}`'
          example: S1_3_1
      description: '`/dashboard` `latestGrades` also carry empty skill fields (`skillId`, `skillDesc`, `skillCode`, ...)'
    Grades:
      type: object
      properties:
        grades:
          type: array
          items:
            $ref: '#/components/schemas/Grade'
    PeriodAverage:
      type: object
      properties:
        periodPos: *id002
        periodDesc: *id001
        periodLabel: *id001
        average:
          type: number
          nullable: true
        color: *id001
        gradeCount: *id002
        subjectCount: *id002
    PeriodAveragesMap:
      description: Object keyed `S{periodPos}`, or `[]` when there are no grades
      oneOf:
      - type: object
        additionalProperties:
          $ref: '#/components/schemas/PeriodAverage'
      - type: array
        maxItems: 0
    SubjectAverage:
      type: object
      properties:
        subjectId: *id002
        subjectCode:
          type: string
          nullable: true
        subjectDesc: *id001
        periodAverages:
          $ref: '#/components/schemas/PeriodAveragesMap'
        globalAverage:
          $ref: '#/components/schemas/PeriodAverage'
    Averages:
      type: object
      properties:
        subjectAverages:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SubjectAverage'
          description: Keyed by subject id
        generalAverages:
          $ref: '#/components/schemas/PeriodAveragesMap'
    Subjects:
      type: object
      properties:
        subjects:
          type: array
          items:
            type: object
            properties:
              id: *id002
              description: *id001
              order: *id002
              teachers:
                type: array
                items:
                  type: object
                  properties:
                    teacherId:
                      type: string
                      example: A1234567
                      description: '`A` prefix here'
                    teacherName: *id001
    Lesson:
      type: object
      properties:
        evtId: *id002
        evtDate:
          type: string
          format: date
          example: '2026-10-21'
        evtCode:
          type: string
          enum:
          - LSF0
          - LSC0
          description: LSF0 regular, LSC0 co-presence
        evtHPos:
          type: integer
          description: Slot within the day (1 = first hour)
        evtDuration: *id002
        classDesc: *id001
        authorName: *id001
        subjectId: *id002
        subjectCode:
          type: string
          nullable: true
          description: 'Can be null (e.g. Educazione civica): use subjectId'
        subjectDesc: *id001
        lessonType:
          type: string
          description: Free text set by the teacher
        lessonArg: *id001
    Lessons:
      type: object
      properties:
        lessons:
          type: array
          items:
            $ref: '#/components/schemas/Lesson'
    AgendaEvent:
      type: object
      properties:
        evtId: *id002
        evtCode:
          type: string
          description: AGNT annotation, AGHW homework, AGCR classroom reservation
        evtDatetimeBegin:
          type: string
          format: date-time
          example: '2026-10-21T16:01:14+02:00'
        evtDatetimeEnd:
          type: string
          format: date-time
          example: '2026-10-21T16:01:14+02:00'
        isFullDay: *id003
        notes: *id001
        authorName: *id001
        classDesc: *id001
        subjectId:
          type: integer
          nullable: true
        subjectDesc:
          type: string
          nullable: true
        homeworkId:
          type: integer
          nullable: true
    Agenda:
      type: object
      properties:
        agenda:
          type: array
          items:
            $ref: '#/components/schemas/AgendaEvent'
    AbsenceEvent:
      type: object
      properties:
        evtId: *id002
        evtCode:
          type: string
          enum:
          - ABA0
          - ABR0
          - ABR1
          - ABU0
          description: Full-day absence / late / short late / early exit
        evtDate:
          type: string
          format: date
          example: '2026-10-21'
        evtHPos:
          type: integer
          nullable: true
        evtValue:
          type: string
          nullable: true
        isJustified: *id003
        justifReasonCode:
          type: string
          nullable: true
          description: A, AC, B, C, D
        justifReasonDesc:
          type: string
          nullable: true
        hoursAbsence:
          type: array
          items: {}
        webJustifStatus:
          type: integer
          description: 1 = justification waiting for approval
    Absences:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/AbsenceEvent'
    LibrettoWebConf:
      type: object
      properties:
        enableJustA: *id003
        enableJustR: *id003
        enableJustU: *id003
        numDaysStopA: *id002
        numDaysStopR: *id002
        numDaysStopU: *id002
        otherInfo:
          type: array
          items: {}
        causals:
          type: array
          items:
            type: object
            properties:
              code: *id001
              usercode: *id001
              shortdesc: *id001
              longdesc: *id001
    NoticeItem:
      type: object
      properties:
        pubId: *id002
        pubDT:
          type: string
          format: date-time
          example: '2026-10-21T16:01:14+02:00'
        readStatus: *id003
        evtCode: *id001
        cntId: *id002
        cntValidFrom:
          type: string
          format: date
          example: '2026-10-21'
        cntValidTo:
          type: string
          format: date
          example: '2026-10-21'
        cntValidInRange: *id003
        cntStatus: *id001
        cntTitle: *id001
        cntNum: *id001
        cntCategory: *id001
        cntHasChanged: *id003
        cntHasAttach: *id003
        needJoin: *id003
        needReply: *id003
        needFile: *id003
        needSign: *id003
        evento_id: *id001
        dinsert_allegato: *id001
        attachments:
          type: array
          items:
            type: object
            properties:
              fileName: *id001
              attachNum: *id002
    Noticeboard:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NoticeItem'
    NoticeRead:
      type: object
      properties:
        item:
          type: object
          properties:
            title: *id001
            text: *id001
        reply:
          type: object
          properties:
            replJoin: *id003
            replText:
              type: string
              nullable: true
            replFile:
              type: string
              nullable: true
            replSign:
              nullable: true
    Communications:
      type: object
      properties:
        communications:
          type: array
          items:
            type: object
            additionalProperties: true
    Didactics:
      type: object
      properties:
        didacticts:
          type: array
          items:
            type: object
            properties:
              teacherId: *id001
              teacherName: *id001
              teacherFirstName: *id001
              teacherLastName: *id001
              folders:
                type: array
                items:
                  type: object
                  properties:
                    folderId: *id002
                    folderName: *id001
                    lastShareDT:
                      type: string
                      format: date-time
                      example: '2026-10-21T16:01:14+02:00'
                    contents:
                      type: array
                      items:
                        type: object
                        properties:
                          contentId: *id002
                          contentName: *id001
                          objectId: *id002
                          objectType:
                            type: string
                            enum:
                            - file
                            - link
                          shareDT:
                            type: string
                            format: date-time
                            example: '2026-10-21T16:01:14+02:00'
      description: Key is `didacticts` (typo of the original API)
    Homework:
      type: object
