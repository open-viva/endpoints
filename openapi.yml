      - $ref: '#/components/parameters/evtCode'
      - $ref: '#/components/parameters/pubId'
      - $ref: '#/components/parameters/attachNum'
      responses:
        '302':
          description: Redirect to a temporary signed URL on `cdndoc.spaggiari.eu`; follow it to get the file
          headers:
            Location:
              schema: *id001
        '401':
          description: Session no longer valid
