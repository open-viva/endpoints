      properties:
        overallTalks:
          type: array
          items:
            type: object
            additionalProperties: true
    Payments:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              evtId: *id002
              evtType:
                type: string
                enum:
                - POL01
                - POL02
                description: trips/activities, voluntary contributions/fees
              schoolYear: *id002
              evtDesc: *id001
              evtAnn: *id001
              payReasonId: *id002
              payReasonDesc: *id001
              partecipation: *id003
              cntHasAttach: *id003
              payPlan:
                type: array
                items:
                  type: object
                  properties:
                    payId: *id002
                    amountDue: &id004
