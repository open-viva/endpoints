  /students/{studentId}/noticeboard/read/{evtCode}/{pubId}/101:
    post:
      tags:
      - Noticeboard
      operationId: readNotice
      summary: Mark a notice as read and get its content
      description: '`101` is a constant always sent by the web client (meaning unknown). Empty form body; JSON body when replying
        (`needReply` / `needJoin`).'
      parameters:
      - $ref: '#/components/parameters/studentId'
      - $ref: '#/components/parameters/evtCode'
      - $ref: '#/components/parameters/pubId'
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticeRead'
        '401':
          description: Session no longer valid
  /students/{studentId}/noticeboard/readmulti/{evtCode}/{pubId}/101:
    post:
      tags:
      - Noticeboard
      operationId: readNoticeMulti
      summary: Same as read, multi variant
      parameters:
      - $ref: '#/components/parameters/studentId'
      - $ref: '#/components/parameters/evtCode'
      - $ref: '#/components/parameters/pubId'
      requestBody:
